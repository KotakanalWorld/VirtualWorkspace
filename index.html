<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Virtual Workspace</title>
    <link rel="icon" type="image/png" href="workspace.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0b1d36;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3rem;
        }

        .logo img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }

        .logo span {
            font-size: 18px;
            font-weight: 500;
            opacity: 0.9;
        }

        .code {
            font-size: 100px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -4px;
            color: #fff;
            margin-bottom: 1rem;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 1.5rem;
            border-radius: 2px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            line-height: 1.6;
            max-width: 340px;
            margin: 0 auto 2.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="workspace.png" alt="Logo">
        <span>Virtual Workspace</span>
    </div>

    <div class="code">404</div>
    <div class="divider"></div>

    <h1>Page Not Found</h1>
    <p>This page doesn't exist or has been moved. Go back to the home page and try again.</p>

    <a class="btn" href="/">← Back to Home</a>

</body>
</html>
