// ── Глобальные переменные для редактора кода ──
window._cfc = {};  // flowId → code string
window._cfa = '';  // активный flowId

function switchCodeTab(fid) {
  const ta = document.getElementById('code-ed');
  if (!ta) return;
  // Сохранить текущий код перед переключением
  if (window._cfa) window._cfc[window._cfa] = ta.value;
  // Переключить
  window._cfa = fid;
  ta.value = window._cfc[fid] || '';
  ta.focus();
  // Обновить стили кнопок
  document.querySelectorAll('.ctab').forEach(b => {
    const active = b.dataset.id === fid;
    b.style.background = active ? 'var(--pri)' : 'var(--surf)';
    b.style.color       = active ? '#fff'       : 'var(--muted)';
    b.style.borderColor = active ? 'var(--pri)' : 'var(--bord)';
  });
}

function showCodeModal() {
  if (!S.cFlow) { alert('Select a flow first'); return; }

  const allFlows = S.flows
    .filter(f => f.name !== '__variables__')
    .map(f => f.id === S.cFlow?.id ? {...f, blocks: JSON.parse(JSON.stringify(S.blocks))} : f);

  // Генерируем код для каждого потока
  window._cfc = {};
  window._cfa = S.cFlow.id;
  for (const f of allFlows) {
    try { window._cfc[f.id] = buildFlowCode(f); }
    catch(e) { window._cfc[f.id] = '// Ошибка генерации кода: ' + e.message; }
  }

  const tabsHtml = allFlows.map(f =>
    `<button class="ctab" data-id="${f.id}" onclick="switchCodeTab('${f.id}')"
      style="padding:5px 12px;border-radius:7px;font-size:12px;font-family:var(--ff);
             cursor:pointer;border:1px solid ${f.id===S.cFlow.id?'var(--pri)':'var(--bord)'};
             transition:all .15s;white-space:nowrap;
             background:${f.id===S.cFlow.id?'var(--pri)':'var(--surf)'};
             color:${f.id===S.cFlow.id?'#fff':'var(--muted)'}"
    >⚡ ${esc(f.name)}</button>`
  ).join('');

  openMod(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <h3 style="flex:1">{ } Bot Code</h3>
      <button class="icon-btn" onclick="closeMod()">✕</button>
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${tabsHtml}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.6">
      <code style="background:rgba(77,169,232,.1);padding:1px 5px;border-radius:3px;color:var(--pri)">// [[тип]]</code> ...
      <code style="background:rgba(77,169,232,.1);padding:1px 5px;border-radius:3px;color:var(--pri)">// [[/тип]]</code>
      — маркеры блоков. &nbsp;
      <code style="background:rgba(77,169,232,.1);padding:1px 5px;border-radius:3px;color:var(--pri)">// cfg: {...}</code>
      — block config (JSON, preserved on Apply).
    </div>
    <textarea id="code-ed" spellcheck="false"
      style="width:100%;height:400px;background:#040810;border:1px solid var(--bord);color:#A8D8EA;
             font-family:var(--mono);font-size:12px;line-height:1.8;border-radius:10px;
             padding:16px;resize:none;outline:none;tab-size:2;margin-bottom:8px"
      onkeydown="handleCodeTab(event)"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" id="btn-ai-gen"
        style="${isPremium()?'background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;border:none':'background:var(--surf);color:var(--muted);border:1px solid var(--bord)'}"
        onclick="${isPremium()?'showAICodeGen()':'showPlans()'}">✨ AI Generate${isPremium()?'':'  💸'}</button>
      <button class="btn btn-primary" style="flex:2" onclick="applyCode()">🔄 Apply</button>
      <button class="btn btn-ghost" onclick="navigator.clipboard.writeText(document.getElementById('code-ed')?.value||'').then(()=>{this.textContent='✓ Copied';setTimeout(()=>this.textContent='📋 Copy',1500)})">📋 Copy</button>
      <button class="btn btn-ghost" onclick="downloadCode()">⬇ .js</button>
      <button class="btn btn-ghost" onclick="closeMod()">Close</button>
    </div>
  `);

  // Show active flow code
  const ta = document.getElementById('code-ed');
  if (ta) ta.value = window._cfc[S.cFlow.id] || '// (empty flow)';
}

function applyCode() {
  const ta = document.getElementById('code-ed');
  if (!ta) { alert('Error: textarea не найдена'); return; }

  // Сохранить текущий редактируемый код
  if (window._cfa) window._cfc[window._cfa] = ta.value;

  let applied = 0, curBlocks = 0;
  // Validate for locked blocks
  for (const [, code] of Object.entries(window._cfc || {})) {
    if (!code) continue;
    const parsed = (() => { try { return codeToBlocks(code); } catch(_) { return []; } })();
    const err = validateBlocks(parsed);
    if (err) { alert('⛔ Cannot apply code:\n\n' + err); return; }
  }

  for (const [flowId, code] of Object.entries(window._cfc || {})) {
    if (!code || !code.trim()) continue;
    const flow = S.flows.find(f => f.id === flowId);
    if (!flow || flow.name === '__variables__') continue;

    let blocks;
    try { blocks = codeToBlocks(code); } catch(e) { console.error('Parse error:', e); continue; }

    // Применяем даже если только триггер (1 блок)
    flow.blocks = blocks;

    // Обновить S.blocks если это активный поток
    if (flow.id === S.cFlow?.id) {
      S.blocks = JSON.parse(JSON.stringify(blocks));
      curBlocks = blocks.length;
    }
    applied++;
  }

  if (!applied) {
    alert('⚠ Could not apply.\nCheck that code is not empty.');
    return;
  }

  renderCanvas();
  renderCfg();
  closeMod();
  setTimeout(() => alert(`✅ Applied to ${applied} flow(s)\nIn current flow: ${curBlocks} block(s)`), 80);
}

// Build readable code for one flow
function buildFlowCode(flow) {
  const blocks = flow.id === S.cFlow?.id ? S.blocks : (flow.blocks || []);
  const lines = [];
  const e = str => (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');

  lines.push('// ══════════════════════════════════════════════');
  lines.push('// Flow: ' + flow.name + ' | id:' + flow.id);
  lines.push('// ══════════════════════════════════════════════');

  if (!blocks.length) { lines.push('// (empty flow)'); return lines.join('\n'); }

  const trig = blocks[0];
  const tc = trig.config || {};
  lines.push('// Триггер: ' + trig.type + (tc.cmd?' /'+tc.cmd : tc.match?' "'+tc.match+'"' : tc.data?' cb:'+tc.data : ''));
  lines.push('// trigger_cfg: ' + JSON.stringify(trig.config || {}));
  lines.push('');

  for (const b of blocks.slice(1)) {
    const c = b.config || {};
    lines.push('// [[' + b.type + ']]');
    // Для custom_script НЕ пишем cfg — код и так в редактируемой секции
    // Для остальных блоков пишем компактный cfg без поля code
    if (b.type !== 'custom_script') {
      const cfgToSave = Object.fromEntries(Object.entries(c).filter(([k]) => k !== 'code'));
      lines.push('// cfg: ' + JSON.stringify(cfgToSave));
    }
    lines.push('// --- editable code below ---');
    switch (b.type) {
      case 'send_text': {
        const o = [];
        if (c.parse_mode) o.push("parse_mode:'" + c.parse_mode + "'");
        if (c.no_preview) o.push('disable_web_page_preview:true');
        if (k) o.push('reply_markup:{inline_keyboard:' + k + '}');
        lines.push("await bot.sendMessage(chatId, sub(chatId,'" + e(c.text||'') + "')" + (o.length ? ',{'+o.join(',')+'}'  : '') + ');');
        break;
      }
      case 'send_img':   lines.push("await bot.sendPhoto(chatId,'" + e(c.url||'') + "'" + (c.caption?",{caption:sub(chatId,'"+e(c.caption)+"')}":'')+');'); break;
      case 'send_vid':   lines.push("await bot.sendVideo(chatId,'" + e(c.url||'') + "');"); break;
      case 'send_audio': lines.push("await bot.sendAudio(chatId,'" + e(c.url||'') + "');"); break;
      case 'send_doc':   lines.push("await bot.sendDocument(chatId,'" + e(c.url||'') + "');"); break;
      case 'edit_msg':   lines.push("await bot.editMessageText(sub(chatId,'"+e(c.text||'')+"'),{chat_id:chatId,message_id:lastMsgId});"); break;
      case 'del_msg':    lines.push('await bot.deleteMessage(chatId,' + (c.target==='user'?'msg.message_id':c.target==='id'?c.msg_id:'lastMsgId') + ');'); break;
      case 'pin_msg':    lines.push('await bot.pinChatMessage(chatId,' + (c.target==='user'?'msg.message_id':c.target==='id'?c.msg_id:'lastMsgId') + ');'); break;
      case 'forward':    lines.push("await bot.forwardMessage('" + (c.to||'chatId') + "',chatId,lastMsgId);"); break;
      case 'inline_kb':  lines.push("await bot.sendMessage(chatId,sub(chatId,'"+e(c.text||'')+"'),{reply_markup:{inline_keyboard:"+(genKbCode(c.buttons)||'[]')+"}}); "); break;
      case 'reply_kb': {
        const k = JSON.stringify((c.buttons||[]).map(r=>(r||[]).map(b=>({text:b.text||''}))).filter(r=>r.length));
        lines.push("await bot.sendMessage(chatId,sub(chatId,'"+e(c.text||'')+"'),{reply_markup:{keyboard:"+k+",resize_keyboard:"+!!c.resize+",one_time_keyboard:"+!!c.one_time+"}});");
        break;
      }
      case 'remove_kb':  lines.push("await bot.sendMessage(chatId,'​',{reply_markup:{remove_keyboard:true}});"); break;
      case 'delay':      lines.push('await sleep(' + (parseInt(c.ms)||1000) + ');'); break;
      case 'set_var':    lines.push("setVar(chatId,'" + (c.var_name||c.name||'') + "',sub(chatId,'" + e(c.val||'') + "'),'" + (c.var_type||'local') + "');"); break;
      case 'var_math': {
        const op = c.operation||'+', vn = c.var_name||'', vt = c.var_type||'local', val = e(c.value||'1');
        if (op==='set') lines.push("setVar(chatId,'"+vn+"',sub(chatId,'"+val+"'),'"+vt+"');");
        else if (op==='concat')  lines.push("setVar(chatId,'"+vn+"',getVar(chatId,'"+vn+"','"+vt+"')+sub(chatId,'"+val+"'),'"+vt+"');");
        else if (op==='prepend') lines.push("setVar(chatId,'"+vn+"',sub(chatId,'"+val+"')+getVar(chatId,'"+vn+"','"+vt+"'),'"+vt+"');");
        else lines.push("setVar(chatId,'"+vn+"',String((parseFloat(getVar(chatId,'"+vn+"','"+vt+"'))||0)"+op+"(parseFloat(sub(chatId,'"+val+"'))||0)),'"+vt+"');");
        break;
      }
      case 'wait_input': lines.push("setVar(chatId,'" + (c.save_to||'input') + "',await waitForInput(chatId" + (parseInt(c.timeout||0)>0?','+parseInt(c.timeout)*1000:'') + "),'local');"); break;
      case 'if_else': {
        const ops={'=':'===','!=':'!==','>':'>','<':'<','contains':'.includes(','startsWith':'.startsWith(','endsWith':'.endsWith('};
        const isMeth = ['contains','startsWith','endsWith'].includes(c.op);
        const vn=(c.var||'').replace(/[{}]/g,'');
        lines.push("if(!(getVar(chatId,'"+vn+"','"+(c.var_type||'local')+"')"+( ops[c.op||'=']||'===')+(isMeth?"'"+e(c.val||'')+"')":"'"+e(c.val||'')+"'")+(isMeth?'':'')+")) return; // if/else");
        break;
      }
      case 'jump': { const fl=S.flows.find(f=>f.id===c.flow); lines.push('// → Flow: '+(fl?fl.name:c.flow||'?')); break; }
      case 'ban':    lines.push('await bot.banChatMember(chatId,msg.from.id);'); break;
      case 'kick':   lines.push('await bot.banChatMember(chatId,msg.from.id); await bot.unbanChatMember(chatId,msg.from.id);'); break;
      case 'mute':   lines.push('await bot.restrictChatMember(chatId,msg.from.id,{permissions:{can_send_messages:false}});'); break;
      case 'unmute': lines.push('await bot.restrictChatMember(chatId,msg.from.id,{permissions:{can_send_messages:true,can_send_media_messages:true,can_send_polls:true,can_send_other_messages:true}});'); break;
      case 'group_only':   lines.push("if(!['group','supergroup'].includes(msg.chat?.type)) return;"); break;
      case 'private_only': lines.push("if(msg.chat?.type!=='private') return;"); break;
      case 'if_admin':     lines.push('// CHECK: user must be admin'); break;
      case 'if_not_admin': lines.push('// CHECK: user must NOT be admin'); break;
      case 'http':   lines.push("const _r=await fetch('"+e(c.url||'')+"',{method:'"+(c.method||'GET')+"'"+(c.body?",body:'"+e(c.body)+"'":'')+'})'+(c.save_to?"; setVar(chatId,'"+c.save_to+"',await _r.text(),'local')":'')+';'); break;
      case 'webhook':lines.push("fetch('"+e(c.url||'')+"',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId,text:msg.text||''})});"); break;
      case 'custom_script':
        (c.code||'// custom code').split('\n').forEach(l => lines.push(l));
        break;
      default: lines.push('// ' + b.type);
    }
    lines.push('// [[/' + b.type + ']]');
    lines.push('');
  }
  return lines.join('\n');
}

// Parse code back to blocks
function codeToBlocks(code) {
  const blocks = [];
  const lines = code.split('\n');

  // ── Restore trigger from trigger_cfg comment (full JSON) ─────────────────
  const trigCfgLine = lines.find(l => l.startsWith('// trigger_cfg:'));
  const trigLine    = lines.find(l => l.startsWith('// Триггер:') || l.startsWith('// Trigger:'));

  if (trigCfgLine) {
    // Full config preserved — use it
    const m = trigLine?.match(/(?:Триггер|Trigger):\s*(\w+)/);
    const type = m?.[1] || 'cmd';
    try {
      const cfg = JSON.parse(trigCfgLine.replace('// trigger_cfg:', '').trim());
      blocks.push({ id:'t'+uid3(), type, config: cfg });
    } catch(_) {}
  } else if (trigLine) {
    const m = trigLine.match(/(?:Триггер|Trigger):\s*(\w+)(.*)?/);
    if (m) {
      const type = m[1], extra = m[2]||'';
      const cmd  = (extra.match(/\/(\w+)/)||[])[1];
      const mtch = (extra.match(/"([^"]+)"/)||[])[1];
      const data = (extra.match(/cb:(\S+)/)||[])[1];
      const cfg  = type==='cmd'?{cmd:cmd||'start',desc:''}:type==='on_text'?{patterns:[{match:mtch||'',mode:'contains'}]}:type==='on_cb'?{data:data||''}:{};
      blocks.push({ id:'t'+uid3(), type, config: cfg });
    }
  }
  if (!blocks.length) blocks.push({ id:'t'+uid3(), type:'cmd', config:{cmd:'start',desc:''} });

  // ── Parse [[type]] ... [[/type]] blocks ───────────────────────────────────
  let inBlock = null, bLines = [];

  for (const line of lines) {
    const openM  = line.match(/^\/\/ \[\[(\w+)\]\]$/);
    const closeM = line.match(/^\/\/ \[\[\/(\w+)\]\]$/);

    if (openM && !inBlock) {
      inBlock = openM[1]; bLines = [];
    } else if (closeM && inBlock === closeM[1]) {
      const type  = inBlock;

      // Найти cfg комментарий
      const cfgLine = bLines.find(l => l.trimStart().startsWith('// cfg:'));
      let config = {};
      if (cfgLine && type !== 'custom_script') {
        try { config = JSON.parse(cfgLine.replace(/^\/\/\s*cfg:\s*/, '').trim()); } catch(_) {}
      }

      // Получить редактируемый код (после разделителя)
      const sepIdx = bLines.findIndex(l => l.includes('--- editable code below ---'));
      const editableLines = sepIdx >= 0 ? bLines.slice(sepIdx + 1) : bLines.filter(l =>
        !l.trimStart().startsWith('// cfg:') &&
        !l.trimStart().startsWith('// ---')
      );
      const editableCode = editableLines.join('\n');

      const def   = getBLK(type);
      const known = def && def.k !== '#666';

      if (type === 'custom_script') {
        // Для custom_script — весь редактируемый код это и есть содержимое блока
        const code = editableCode.trim();
        blocks.push({ id:'b'+uid3(), type:'custom_script', config:{ code } });
      } else if (known && Object.keys(config).length > 0) {
        // Конфиг восстановлен из JSON — используем его
        blocks.push({ id:'b'+uid3(), type, config });
      } else if (known) {
        // Fallback — парсим из кода
        blocks.push({ id:'b'+uid3(), type, config: cfgFromCode(type, editableCode) });
      } else {
        // Неизвестный тип → custom_script
        blocks.push({ id:'b'+uid3(), type:'custom_script', config:{ code: editableCode.trim(), original_type: type } });
      }
      inBlock = null; bLines = [];
    } else if (inBlock) {
      bLines.push(line);
    }
  }

  // Fallback: no markers → put everything as custom_script
  if (blocks.length === 1) {
    const nonComment = lines.filter(l => l.trim() && !l.trim().startsWith('//')).join('\n').trim();
    if (nonComment) blocks.push({ id:'b'+uid3(), type:'custom_script', config:{ code: nonComment } });
  }

  return blocks;
}

function uid3() { return Date.now().toString(36)+(Math.random()*9999|0).toString(36); }

function cfgFromCode(type, code) {
  const u = s => (s||'').replace(/\\n/g,'\n').replace(/\\'/g,"'");
  switch(type) {
    case 'send_text': {
      const m = code.match(/sendMessage\(chatId,\s*sub\(chatId,\s*'((?:[^'\\]|\\.)*)'\)/);
      const pm = code.match(/parse_mode:'(\w+)'/);
      return { text:u(m?m[1]:''), parse_mode:pm?pm[1]:'' };
    }
    case 'send_img':   { const m=code.match(/sendPhoto\(chatId,'([^']+)'/);    return {url:m?m[1]:''}; }
    case 'send_vid':   { const m=code.match(/sendVideo\(chatId,'([^']+)'/);    return {url:m?m[1]:''}; }
    case 'send_audio': { const m=code.match(/sendAudio\(chatId,'([^']+)'/);    return {url:m?m[1]:''}; }
    case 'send_doc':   { const m=code.match(/sendDocument\(chatId,'([^']+)'/); return {url:m?m[1]:''}; }
    case 'delay':      { const m=code.match(/sleep\((\d+)\)/);  return {ms:m?m[1]:'1000'}; }
    case 'set_var':    {
      const m = code.match(/setVar\(chatId,'([^']+)',sub\(chatId,'([^']*)'\),'(\w+)'\)/);
      return { var_name:m?m[1]:'', val:u(m?m[2]:''), var_type:m?m[3]:'local' };
    }
    case 'var_math':   { const m=code.match(/setVar\(chatId,'([^']+)'/); return {var_name:m?m[1]:'',operation:'+',value:'1',var_type:'local'}; }
    case 'wait_input': { const m=code.match(/setVar\(chatId,'([^']+)'/); return {save_to:m?m[1]:'input',timeout:'60'}; }
    case 'if_else': {
      const vn=code.match(/getVar\(chatId,'([^']+)','(\w+)'\)/);
      const op=code.match(/(===|!==|\.includes\(|\.startsWith\(|\.endsWith\(|>(?!=)|<(?!=))/);
      const opMap={'===':'=','!==':'!=','>':'>','<':'<','.includes(':'contains','.startsWith(':'startsWith','.endsWith(':'endsWith'};
      return { var_name:vn?vn[1]:'', var_type:vn?vn[2]:'local', op:op?opMap[op[1]]||'=':'=', val:'' };
    }
    case 'http': {
      const u2=code.match(/fetch\('([^']+)'/), me=code.match(/method:'(\w+)'/);
      return { url:u2?u2[1]:'', method:me?me[1]:'GET' };
    }
    case 'inline_kb': { const t=code.match(/sub\(chatId,'((?:[^'\\]|\\.)*)'\)/); return {text:u(t?t[1]:''),buttons:[]}; }
    case 'jump':  { const f=code.match(/→ Flow: (.+)/); const fl=f?S.flows.find(x=>x.name===f[1].trim()):null; return {flow:fl?fl.id:''}; }
    case 'custom_script': return {code};
    default: return {};
  }
}

function copyCode() {
  const txt = document.getElementById('code-editor')?.value;
  if (txt) navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('#mbox .btn-primary');
    if(btn){btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='📋 Copy',2000)}
  });
}

function downloadCode() {
  const txt = document.getElementById('code-editor')?.value || '';
  const a = document.createElement('a');
  a.href = 'data:text/javascript;charset=utf-8,' + encodeURIComponent(txt);
  a.download = (S.cBot?.name||'bot').replace(/\s+/g,'_') + '.js';
  a.click();
}

function handleCodeTab(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const el = e.target, s = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.substring(0, s) + '  ' + el.value.substring(end);
  el.selectionStart = el.selectionEnd = s + 2;
}

function generateCode() {
  const botName  = S.cBot?.name  || 'Мой bot';
  const botToken = S.cBot?.token || 'YOUR_BOT_TOKEN';
  const allFlows = S.flows.map(f => f.id === S.cFlow?.id ? {...f, blocks: S.blocks} : f);

  const L = [
    `// ${'═'.repeat(46)}`,
    `// Generated by Telebot Creator`,
    `// Bot: ${botName}`,
    `// ${'═'.repeat(46)}`,
    ``,
    `const TelegramBot = require('node-telegram-bot-api');`,
    `const bot = new TelegramBot('${botToken}', { polling: true });`,
    ``,
    `const userVars   = new Map(); // variables: chatId → { key: val }`,
    `const waiting    = new Map(); // waiting for input`,
    ``,
    `// Helper functions`,
    `const setVar = (cid,k,v) => { const m=userVars.get(cid)||{}; m[k]=v; userVars.set(cid,m); };`,
    `const getVar = (cid,k)   => userVars.get(cid)?.[k] ?? '';`,
    `const sub    = (cid,s)   => String(s||'').replace(/\\{\\{(\\w+)\\}\\}/g,(_,k)=>userVars.get(cid)?.[k]??'');`,
    `const sleep  = ms        => new Promise(r=>setTimeout(r,ms));`,
    `const parseDur = s => { if(!s||s==='0')return 0; const n=parseInt(s),now=Math.floor(Date.now()/1000); return s.includes('d')?now+n*86400:s.includes('h')?now+n*3600:s.includes('m')?now+n*60:0; };`,
    ``,
    `function waitForInput(chatId, timeoutMs=0) {`,
    `  return new Promise(resolve => {`,
    `    const timer = timeoutMs>0 ? setTimeout(()=>{ waiting.delete(chatId); resolve(''); }, timeoutMs) : null;`,
    `    waiting.set(chatId, { resolve, timer });`,
    `  });`,
    `}`,
    ``,
    `// Обраbotчик всех сообщений`,
    `bot.on('message', async (msg) => {`,
    `  const chatId = msg.chat.id;`,
    `  if (waiting.has(chatId)) {`,
    `    const p = waiting.get(chatId);`,
    `    clearTimeout(p.timer); waiting.delete(chatId);`,
    `    p.resolve(msg.text||''); return;`,
    `  }`,
  ];

  // Collect all message-based flows
  const cmdFlows    = allFlows.filter(f=>(f.blocks||[])[0]?.type==='cmd');
  const textFlows   = allFlows.filter(f=>(f.blocks||[])[0]?.type==='on_text');
  const photoFlows  = allFlows.filter(f=>(f.blocks||[])[0]?.type==='on_photo');
  const docFlows    = allFlows.filter(f=>(f.blocks||[])[0]?.type==='on_doc');
  const floodFlows  = allFlows.filter(f=>(f.blocks||[])[0]?.type==='on_flood');

  if (floodFlows.length) {
    L.push(`// Flood tracker`);
    L.push(`const _flood   = new Map(); // key → [timestamps]`);
    L.push(`const _floodCD = new Map(); // key → last fired`);
    L.push(``);
  }

  // Flood detection (before other handlers)
  for (const flow of floodFlows) {
    const t = flow.blocks[0];
    const limit  = parseInt(t.config?.count||5);
    const window = parseInt(t.config?.seconds||10);
    const cdMode = t.config?.cooldown_mode||'once';
    L.push(`  // Anti-spam: ${limit} messages in ${window} sec — flow "${flow.name}"`);
    L.push(`  {`);
    L.push(`    const _fk = chatId+':'+msg.from.id, _now = Date.now();`);
    L.push(`    const _times = (_flood.get(_fk)||[]).filter(ts=>_now-ts<${window*1000});`);
    L.push(`    _times.push(_now); _flood.set(_fk,_times);`);
    L.push(`    if (_times.length>=${limit}) {`);
    if (cdMode==='once') {
      L.push(`      if (_now-(_floodCD.get(_fk)||0) > ${window*1000}) {`);
      L.push(`        _floodCD.set(_fk,_now);`);
    }
    genActions(L, flow.blocks.slice(1), cdMode==='once'?'        ':'      ');
    if (cdMode==='once') L.push(`      }`);
    L.push(`      return;`);
    L.push(`    }`);
    L.push(`  }`);
  }
  L.push(``);

  // Commands
  let flowIdx = 0;
  for (const flow of cmdFlows) {
    flowIdx++;
    const t   = flow.blocks[0];
    const cmd = t.config?.cmd || 'start';
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`// FLOW: /${cmd} | id:${flow.id}`);
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`  if (msg.text === '/${cmd}' || msg.text?.startsWith('/${cmd} ')) {`);
    genActions(L, flow.blocks.slice(1), '    ');
    L.push(`    return;`);
    L.push(`  }`);
    L.push(``);
  }

  // Text triggers
  for (const flow of textFlows) {
    flowIdx++;
    const t    = flow.blocks[0];
    const patterns = t.config?.patterns || [{match:t.config?.match||'',mode:t.config?.mode||'contains'}];
    const firstPat = patterns[0];
    const match= firstPat.match||'';
    const mode = firstPat.mode||'contains';
    const cond = mode==='contains'?`msg.text?.includes('${match}')`:mode==='equals'?`msg.text === '${match}'`:mode==='starts'?`msg.text?.startsWith('${match}')`:mode==='regex'?`/${match}/.test(msg.text||'')`:false;
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`// FLOW: ${flow.name} | id:${flow.id}`);
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`  if (${cond}) {`);
    genActions(L, flow.blocks.slice(1), '    ');
    L.push(`    return;`);
    L.push(`  }`);
    L.push(``);
  }

  // Photo
  for (const flow of photoFlows) {
    L.push(`  if (msg.photo?.length) {`);
    genActions(L, flow.blocks.slice(1), '    ');
    L.push(`    return; }`);
  }

  // Doc
  for (const flow of docFlows) {
    L.push(`  if (msg.document) {`);
    genActions(L, flow.blocks.slice(1), '    ');
    L.push(`    return; }`);
  }

  L.push(`});`);
  L.push(``);

  // Callback queries
  const cbFlows   = allFlows.filter(f=>(f.blocks||[])[0]?.type==='on_cb');
  const flowBtns  = allFlows.filter(f=>f.id);  // for __flow__ buttons

  if (cbFlows.length || flowBtns.length) {
    L.push(`bot.on('callback_query', async (query) => {`);
    L.push(`  const chatId = query.message.chat.id;`);
    L.push(`  const msg    = query.message;`);
    L.push(`  await bot.answerCallbackQuery(query.id);`);
    L.push(``);

    // __flow__ handler
    L.push(`  // Buttons with direct flow trigger`);
    for (const flow of allFlows) {
      L.push(`  if (query.data === '__flow__${flow.id}') {`);
      genActions(L, flow.blocks.slice(1), '    ');
      L.push(`    return; }`);
    }
    L.push(``);

    for (const flow of cbFlows) {
      flowIdx++;
      const t = flow.blocks[0];
      const d = t.config?.data;
      L.push(`// ${'═'.repeat(50)}`);
      L.push(`// FLOW: ${flow.name} | id:${flow.id}`);
      L.push(`// ${'═'.repeat(50)}`);
      if (d) L.push(`  if (query.data === '${d}') {`);
      else   L.push(`  {`);
      genActions(L, flow.blocks.slice(1), '    ');
      if (d) L.push(`  }`); else L.push(`  }`);
      L.push(``);
    }
    L.push(`});`);
    L.push(``);
  }

  // join/leave
  const joinFlow  = allFlows.find(f=>(f.blocks||[])[0]?.type==='on_join');
  const leaveFlow = allFlows.find(f=>(f.blocks||[])[0]?.type==='on_leave');
  if (joinFlow) {
    flowIdx++;
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`// FLOW: ${joinFlow.name} | id:${joinFlow.id}`);
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`bot.on('new_chat_members', async (msg) => {`);
    L.push(`  const chatId = msg.chat.id;`);
    genActions(L, joinFlow.blocks.slice(1), '  ');
    L.push(`});`); L.push(``);
  }
  if (leaveFlow) {
    flowIdx++;
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`// FLOW: ${leaveFlow.name} | id:${leaveFlow.id}`);
    L.push(`// ${'═'.repeat(50)}`);
    L.push(`bot.on('left_chat_member', async (msg) => {`);
    L.push(`  const chatId = msg.chat.id;`);
    genActions(L, leaveFlow.blocks.slice(1), '  ');
    L.push(`});`); L.push(``);
  }

  L.push(`bot.on('polling_error', e => console.error('Error:', e.message));`);
  L.push(`console.log('✅ ${botName} started!');`);

  return L.join('\n');
}

function genActions(L, blocks, indent) {
  for (const b of blocks) {
    const c = b.config || {};
    const s = (str) => (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
    L.push(`${indent}// <<${b.type}>>`);
    switch(b.type) {
      case 'custom_script':
        (c.code||'// custom code').split('\n').forEach(line => L.push(`${indent}${line}`));
        break;
      case 'send_text': {
        const kb = genKbCode(c.buttons);
        const opts = [];
        if (c.parse_mode) opts.push(`parse_mode:'${c.parse_mode}'`);
        if (c.no_preview) opts.push(`disable_web_page_preview:true`);
        if (kb) opts.push(`reply_markup:{inline_keyboard:${kb}}`);
        L.push(`${indent}await bot.sendMessage(chatId, sub(chatId,'${s(c.text||'...')}')${opts.length?',{'+opts.join(',')+'}'  :''});`);
        break;
      }
      case 'send_img': {
        const kb=genKbCode(c.buttons);
        L.push(`${indent}await bot.sendPhoto(chatId,'${s(c.url||'')}',{${c.caption?`caption:sub(chatId,'${s(c.caption)}'),`:''}${c.parse_mode?`parse_mode:'${c.parse_mode}',`:''}${kb?`reply_markup:{inline_keyboard:${kb}}`:''} });`);
        break;
      }
      case 'send_vid':   L.push(`${indent}await bot.sendVideo(chatId,'${s(c.url||'')}');`); break;
      case 'send_audio': L.push(`${indent}await bot.sendAudio(chatId,'${s(c.url||'')}');`); break;
      case 'send_doc':   L.push(`${indent}await bot.sendDocument(chatId,'${s(c.url||'')}');`); break;
      case 'edit_msg':   L.push(`${indent}await bot.editMessageText(sub(chatId,'${s(c.text||'')}'),{chat_id:chatId,message_id:lastMsgId});`); break;
      case 'del_msg': {
        const id = c.target==='user'?'msg.message_id':c.target==='id'?c.msg_id:'lastMsgId';
        L.push(`${indent}await bot.deleteMessage(chatId,${id});`); break;
      }
      case 'pin_msg': {
        const id = c.target==='user'?'msg.message_id':c.target==='id'?c.msg_id:'lastMsgId';
        L.push(`${indent}await bot.pinChatMessage(chatId,${id}${c.silent?',{disable_notification:true}':''});`); break;
      }
      case 'forward':  L.push(`${indent}await bot.forwardMessage('${c.to||"chatId"}',chatId,lastMsgId);`); break;
      case 'inline_kb':{
        const kb=genKbCode(c.buttons);
        L.push(`${indent}await bot.sendMessage(chatId,sub(chatId,'${s(c.text||'Выбери:')}'),{reply_markup:{inline_keyboard:${kb||'[]'}}});`);
        break;
      }
      case 'reply_kb': {
        const kb=JSON.stringify((c.buttons||[]).map(r=>(r||[]).map(b=>({text:b.text||''}))).filter(r=>r.length));
        L.push(`${indent}await bot.sendMessage(chatId,sub(chatId,'${s(c.text||'​')}'),{reply_markup:{keyboard:${kb},resize_keyboard:${!!c.resize},one_time_keyboard:${!!c.one_time}}});`);
        break;
      }
      case 'remove_kb': L.push(`${indent}await bot.sendMessage(chatId,'​',{reply_markup:{remove_keyboard:true}});`); break;
      case 'if_else': {
        const vn=(c.var||'').replace(/[{}]/g,'');
        const ops={'=':'===','!=':'!==','contains':'.includes(','startsWith':'.startsWith(','endsWith':'.endsWith(','>':`>`,'<':'<'};
        const meth=['contains','startsWith','endsWith'].includes(c.op);
        const cond=meth?`getVar(chatId,'${vn}')${ops[c.op]}'${s(c.val||'')}')`:
                       `getVar(chatId,'${vn}') ${ops[c.op]||'==='} '${s(c.val||'')}'`;
        L.push(`${indent}if (!(${cond})) return; // if/else`);
        break;
      }
      case 'wait_input': {
        const ms = parseInt(c.timeout||0)*1000;
        L.push(`${indent}setVar(chatId,'${c.save_to||'input'}', await waitForInput(chatId${ms>0?','+ms:''}));`);
        break;
      }
      case 'delay':   L.push(`${indent}await sleep(${parseInt(c.ms)||1000}); // delay`); break;
      case 'set_var': L.push(`${indent}setVar(chatId,'${c.name||'var'}',sub(chatId,'${s(c.val||'')}'));`); break;
      case 'jump': {
        const f=S.flows.find(f=>f.id===c.flow);
        L.push(`${indent}// → Jump to flow: ${f?.name||c.flow||'?'}`); break;
      }
      case 'ban':    L.push(`${indent}await bot.banChatMember(chatId,msg.from.id${c.time?`,{until_date:parseDur('${c.time}')}`:''}); // бан`); break;
      case 'kick':   L.push(`${indent}await bot.banChatMember(chatId,msg.from.id); await bot.unbanChatMember(chatId,msg.from.id); // кик`); break;
      case 'mute':   L.push(`${indent}await bot.restrictChatMember(chatId,msg.from.id,{permissions:{can_send_messages:false}${c.time?`,until_date:parseDur('${c.time}')`:''}}); // мут`); break;
      case 'unmute': L.push(`${indent}await bot.restrictChatMember(chatId,msg.from.id,{permissions:{can_send_messages:true,can_send_media_messages:true,can_send_polls:true,can_send_other_messages:true}}); // размут`); break;
      case 'promote':L.push(`${indent}await bot.promoteChatMember(chatId,msg.from.id,{can_change_info:${!!c.can_change_info},can_delete_messages:${!!c.can_delete},can_restrict_members:${!!c.can_ban},can_invite_users:${!!c.can_invite},can_pin_messages:${!!c.can_pin}});`); break;
      case 'http': {
        L.push(`${indent}const _r = await fetch('${s(c.url||'')}',{method:'${c.method||'GET'}'${c.body?`,body:'${s(c.body)}'`:''}});`);
        if(c.save_to) L.push(`${indent}setVar(chatId,'${c.save_to}',await _r.text());`);
        break;
      }
      case 'webhook': L.push(`${indent}fetch('${s(c.url||'')}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId})});`); break;
      case 'invite':  L.push(`${indent}const _inv=await bot.createChatInviteLink('${c.chat_id||"chatId"}'); await bot.sendMessage(chatId,_inv.invite_link);`); break;
      default: L.push(`${indent}// custom: ${b.type}`);
    }
    L.push(`${indent}// <</${b.type}>>`);
  }
}

function genKbCode(buttons) {
  if(!buttons?.length) return null;
  const rows=(buttons).map(row=>(row||[]).map(btn=>{
    if(btn.btype==='url')  return `{text:'${(btn.text||'').replace(/'/g,"\\'")}',url:'${btn.url||''}'}`;
    if(btn.btype==='flow') return `{text:'${(btn.text||'').replace(/'/g,"\\'")}',callback_data:'__flow__${btn.flow_id||''}'}`;
    return `{text:'${(btn.text||'').replace(/'/g,"\\'")}',callback_data:'${btn.callback_data||btn.text||'btn'}'}`;
  })).filter(r=>r.length);
  if(!rows.length) return null;
  return '['+rows.map(r=>'['+r.join(',')+']').join(',')+']';
}

/* Строит inline_keyboard из массива rows, возвращает null если пусто */
function buildKb(rows) {
  if (!rows?.length) return null;
  const kb = (rows).map(row=>(row||[]).map(btn=>{
    if(btn.btype==='url')  return {text:btn.text||'', url:btn.url||'https://'};
    if(btn.btype==='flow') return {text:btn.text||'', callback_data:'__flow__'+(btn.flow_id||'')};
    return {text:btn.text||'', callback_data:btn.callback_data||btn.text||'btn'};
  })).filter(r=>r.length);
  return kb.length ? kb : null;
}

class BotEngine {
  constructor(token, getFlows, botVars=[]) {
    this.token    = token;
    this.getFlows = getFlows;
    this.offset   = 0;
    this.running  = false;
    this.pid      = null;
    this.waiting  = new Map();
    this.vars     = new Map();   // local: userId → {k:v}
    this.gVars    = {};          // global: {k:v}
    this.chatVars = new Map();   // group: chatId → {k:v}
    this.flood    = new Map();   // `uid:cid` → [timestamps]
    this.floodCD  = new Map();   // `uid:cid` → last fired ms
    this.geminiCtx= new Map();   // `uid:cid:session` → [{role,parts:[{text}]}]
    this.gptCtx   = new Map();   // `uid:cid:session` → [{role,content}]
    // Init global vars from definitions
    for (const v of botVars) {
      if (v.type==='global' && v.name) this.gVars[v.name] = v.initial ?? '0';
    }
  }

  // Get var (local / group / global)
  getVar(chatId, name, type='local') {
    if (!name) return '';
    if (type==='global') return this.gVars[name] ?? '';
    if (type==='group')  { const m=this.chatVars.get(chatId)||{}; return m[name]??''; }
    return this.vars.get(chatId)?.[name] ?? '';
  }

  // Set var (local / group / global)
  setVar(chatId, name, value, type='local') {
    if (!name) return;
    if (type==='global') { this.gVars[name]=value; return; }
    if (type==='group')  { const m=this.chatVars.get(chatId)||{}; m[name]=value; this.chatVars.set(chatId,m); return; }
    const m=this.vars.get(chatId)||{}; m[name]=value; this.vars.set(chatId,m);
  }

  addLog(text, type='sys') {
    const el = document.getElementById('log-msgs');
    if (!el) return;
    const d = document.createElement('div');
    d.className = 'log-line log-'+type;
    d.textContent = new Date().toLocaleTimeString('ru')+' '+text;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    // Keep max 200 lines
    while (el.children.length > 200) el.removeChild(el.firstChild);
  }

  async tg(method, params={}) {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), method==='getUpdates' ? 30000 : 10000);
    try {
      const r = await fetch('https://api.telegram.org/bot'+this.token+'/'+method, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(params), signal:ctrl.signal
      });
      clearTimeout(tid);
      return r.json();
    } catch(e) {
      clearTimeout(tid);
      if (e.name==='AbortError') return {ok:false, description:'timeout'};
      throw e;
    }
  }

  async start() {
    const me = await this.tg('getMe');
    if (!me.ok) throw new Error(me.description || 'Неверный токен');
    this.botInfo = me.result;
    this.running = true;
    this.addLog('✅ @'+me.result.username+' started', 'out');
    this.loop();
  }

  stop() {
    this.running = false;
    clearTimeout(this.pid);
    this.addLog('⛔ Bot stopped', 'err');
  }

  async loop() {
    if (!this.running) return;
    try {
      const r = await this.tg('getUpdates', { offset: this.offset, timeout: 5, limit: 50, allowed_updates: ['message','callback_query','pre_checkout_query'] });
      if (!r.ok) {
        const desc = r.description || '';
        if (desc.includes('409') || desc.includes('Conflict')) {
          this.addLog('⚠ 409: Bot already running elsewhere. Stopping browser mode.', 'err');
          this.stop();
          const btn = document.getElementById('btn-run');
          if (btn) { btn.textContent='▶ Run Bot'; btn.style.cssText='background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.35);min-width:110px'; btn.disabled=false; }
          const st = document.getElementById('bot-status');
          if (st) st.style.display='none';
          // Auto-check if bot is running on server
          if (S.cBot?.id) setTimeout(()=>checkServerStatus(S.cBot.id), 500);
          return;
        }
      } else if (r.result?.length) {
        for (const upd of r.result) {
          this.offset = upd.update_id + 1;
          await this.handle(upd);
        }
      }
    } catch(e) { if (this.running) this.addLog('⚠ '+e.message, 'err'); }
    if (this.running) this.pid = setTimeout(() => this.loop(), 600);
  }

  async handle(upd) {
    const flows = this.getFlows();
    if (upd.message) {
      const msg = upd.message;
      const chatId = msg.chat.id;
      // Skip channel posts (no sender)
      if (!msg.from) return;
      const name = msg.from.first_name || msg.from.username || String(msg.from.id);
      const chatType = msg.chat.type === 'private' ? '💬 ЛС' :
                       msg.chat.type === 'group' ? '👥 ' + (msg.chat.title||'группа') :
                       msg.chat.type === 'supergroup' ? '👥 ' + (msg.chat.title||'супергруппа') : '📢 канал';
      const text = msg.text || (msg.photo?'[фото]':msg.document?'[файл]':msg.video?'[видео]':msg.audio?'[аудио]':'[медиа]');
      this.addLog('📩 ['+chatType+'] '+name+': '+text, 'in');

      // Check waiting for input
      // Check if waiting for input from this user
      const wkey = String(msg.from.id)+':'+String(chatId);
      if (this.waiting.has(wkey)) {
        const p = this.waiting.get(wkey);
        clearTimeout(p.timer); this.waiting.delete(wkey);
        this.setVar(chatId, p.varName, msg.text||'', 'local');
        p.resolve && p.resolve(msg.text||''); return;
      }

      // ── Flood / anti-spam (robust sliding window) ──
      const floodFlows = flows.filter(f => (f.blocks||[])[0]?.type === 'on_flood');
      for (const ff of floodFlows) {
        const t       = ff.blocks[0];
        const limit   = Math.max(1, parseInt(t.config?.count   || 5));
        const winMs   = Math.max(1000, parseInt(t.config?.seconds || 10) * 1000);
        const cdMode  = t.config?.cooldown_mode || 'once';
        const uid     = msg.from?.id;
        if (!uid) continue;
        const fkey  = `${uid}:${chatId}`;
        const now   = Date.now();

        // Sliding window — keep only timestamps within window
        const prev  = this.flood.get(fkey) || [];
        const times = prev.filter(ts => now - ts < winMs);
        times.push(now);
        this.flood.set(fkey, times);

        // Cleanup old entries periodically (every 100 messages)
        if (Math.random() < 0.01) {
          for (const [k,v] of this.flood.entries()) {
            if (v.every(ts => now - ts > winMs * 2)) this.flood.delete(k);
          }
        }

        if (times.length >= limit) {
          const lastFired = this.floodCD.get(fkey) || 0;
          const cooldownPassed = cdMode === 'always' || (now - lastFired > winMs);
          if (cooldownPassed) {
            this.floodCD.set(fkey, now);
            this.addLog(`🚨 FLOOD: ${msg.from?.first_name||uid} — ${times.length} msgs in ${winMs/1000}с`, 'err');
            if (await this.checkConds(chatId,t.config?.conditions,msg)) {
              await this.run(chatId, msg, ff, flows);
            }
          }
          return; // Block from triggering other flows
        }
      }

      // Normal flow matching
      const flow = await this.match(msg, flows);
      if (flow) { this.addLog('⚡ Flow: '+flow.name, 'sys'); await this.run(chatId, msg, flow, flows); }
    }
    if (upd.callback_query) {
      const q = upd.callback_query;
      await this.tg('answerCallbackQuery', { callback_query_id: q.id });
      const chatId = q.message.chat.id;
      this.addLog('🔘 callback: '+q.data, 'in');

      if (q.data?.startsWith('__flow__')) {
        const flowId = q.data.replace('__flow__','');
        const target = flows.find(f=>f.id===flowId);
        if (target) { const fm={...q.message,from:q.from,callback_data:q.data}; await this.run(chatId,fm,target,flows); }
        return;
      }

      const flow = flows.find(f => { const t=(f.blocks||[])[0]; return t?.type==='on_cb'&&(!t.config?.data||t.config.data===q.data||t.config.data==='*'); });
      if (flow) await this.run(chatId, {...q.message, from:q.from, callback_data:q.data}, flow, flows);
    }

    // Handle pre_checkout_query (Stars payment)
    if (upd.pre_checkout_query) {
      const pq = upd.pre_checkout_query;
      this.addLog('💳 Pre-checkout: '+pq.invoice_payload, 'sys');
      await this.tg('answerPreCheckoutQuery', {pre_checkout_query_id: pq.id, ok: true});
    }

    // Handle successful_payment → on_payment trigger
    if (upd.message?.successful_payment) {
      const msg = upd.message;
      const chatId = msg.chat.id;
      const payload = msg.successful_payment.invoice_payload;
      this.addLog('💰 Payment received! payload: '+payload, 'sys');
      const payFlow = flows.find(f => {
        const t = f.blocks?.[0];
        return t?.type==='on_payment' && (!t.config?.payload || t.config.payload===payload);
      });
      if (payFlow) {
        this.addLog('⚡ Flow: '+payFlow.name, 'sys');
        await this.run(chatId, msg, payFlow, flows);
      } else {
        this.addLog('⚠ No on_payment flow found for payload: '+payload, 'err');
      }
    }
  }

  async match(msg, flows) {
    for (const flow of flows) {
      const blocks = flow.blocks||[];
      if (!blocks.length) continue;
      const t = blocks[0];
      switch(t.type) {
        case 'cmd': { const cmd='/'+( t.config?.cmd||''); if ((msg.text===cmd||msg.text?.startsWith(cmd+' '))&&await this.checkConds(msg.chat?.id,t.config?.conditions,msg)) return flow; break; }
        case 'on_text': {
          const txt = msg.text||'';
          if (msg.from?.is_bot && !t.config?.allow_bots) break;
          const patterns = t.config?.patterns || [{match:t.config?.match||'', mode:t.config?.mode||'contains'}];
          const hit = patterns.some(p => {
            const m=p.match||'', mode=p.mode||'contains';
            if (!m) return false;
            return mode==='contains'?txt.includes(m):mode==='equals'?txt===m:mode==='starts'?txt.startsWith(m):mode==='ends'?txt.endsWith(m):mode==='regex'?(()=>{try{return new RegExp(m).test(txt)}catch(_){return false}})():false;
          });
          if (hit&&await this.checkConds(msg.chat?.id,t.config?.conditions,msg)) return flow; break;
        }
        case 'on_photo': if (msg.photo?.length&&await this.checkConds(msg.chat?.id,t.config?.conditions,msg)) return flow; break;
        case 'on_doc':   if (msg.document&&await this.checkConds(msg.chat?.id,t.config?.conditions,msg))      return flow; break;
        case 'on_var': {
          const c=t.config||{}, chatId=msg.chat?.id;
          const vv=String(this.getVar(chatId,c.var_name||'',c.var_type||'local'));
          const cv=c.val||'';
          const hit=c.op==='='?vv===cv:c.op==='!='?vv!==cv:c.op==='contains'?vv.includes(cv):c.op==='startsWith'?vv.startsWith(cv):c.op==='>'?+vv>+cv:c.op==='<'?+vv<+cv:false;
          if (hit&&await this.checkConds(chatId,c.conditions,msg)) return flow; break;
        }
        case 'on_username': {
          const c=t.config||{};
          const uname=(msg.from?.username||'').toLowerCase();
          const target=(c.username||'').toLowerCase().replace(/^@/,'');
          const mode=c.mode||'equals';
          const hit = mode==='list'
            ? target.split(',').map(s=>s.trim()).includes(uname)
            : mode==='contains' ? uname.includes(target) : uname===target;
          if (hit&&await this.checkConds(msg.chat?.id,c.conditions,msg)) return flow; break;
        }
      }
    }
    return null;
  }

  async run(chatId, msg, flow, flows) {
    const blocks=flow.blocks||[], ctx=this.ctx(chatId,msg);
    let lastId=msg.message_id;
    this.addLog('🔧 run: '+flow.name+' — '+blocks.length+' blocks, executing '+(blocks.length-1)+' actions', 'sys');
    for (let i=1;i<blocks.length;i++) {
      this.addLog('🔧 exec block['+i+']: '+blocks[i].type, 'sys');
      const res=await this.exec(chatId,msg,blocks[i],ctx,lastId,flows).catch(e=>{this.addLog('⚠ exec error: '+e.message,'err'); return null;});
      if (res?.msgId) lastId=res.msgId;
      if (res?.stop) break;
      if (res?.jump) { const t=flows.find(f=>f.id===res.jump); if(t) await this.run(chatId,msg,t,flows); break; }
    }
  }

  async exec(chatId, msg, block, ctx, lastId, flows) {
    const c=block.config||{};
    const sub=s=>{ if(!s) return ''; const gv=this.chatVars.get(chatId)||{}; const v={...ctx,...(this.vars.get(chatId)||{}),...gv,...this.gVars}; return String(s).replace(/\{\{(\w+)\}\}/g,(_,k)=>v[k]??''); };
    try {
      switch(block.type) {
        case 'send_text': {
          const p={chat_id:chatId,text:sub(c.text||'...')};
          if(c.parse_mode) p.parse_mode=c.parse_mode;
          if(c.no_preview) p.disable_web_page_preview=true;
          const kb=buildKb(c.buttons);
          if(kb) p.reply_markup={inline_keyboard:kb};
          const r=await this.tg('sendMessage',p);
          this.addLog('✉ Sent:: '+sub(c.text||'').substring(0,40)+(kb?' + кнопки':''), 'out');
          return {msgId:r.result?.message_id};
        }
        case 'send_admin': {
          const text = sub(c.text||'...');
          const target = c.target||'admins';
          const opts = {};
          if(c.parse_mode) opts.parse_mode = c.parse_mode;
          if (target === 'specific' && c.user_id) {
            await this.tg('sendMessage', {chat_id: parseInt(c.user_id), text, ...opts});
            this.addLog('🛡 Sent: пользователю '+c.user_id, 'out');
          } else {
            // Get admin list
            const res = await this.tg('getChatAdministrators', {chat_id: chatId});
            if (res.ok && res.result) {
              const admins = target==='owner'
                ? res.result.filter(a=>a.status==='creator')
                : res.result.filter(a=>a.status==='creator'||a.status==='administrator');
              let sent = 0;
              for (const admin of admins) {
                if (admin.user?.is_bot) continue;
                const r = await this.tg('sendMessage', {chat_id: admin.user.id, text, ...opts});
                if (r.ok) sent++;
              }
              this.addLog(`🛡 Sent: ${sent} ${target==='owner'?'владельцу':'администраторам'}`, 'out');
            } else {
              this.addLog('⚠ Could not get admin list', 'err');
            }
          }
          break;
        }
        case 'send_img': {
          const p={chat_id:chatId,photo:c.url};
          if(c.caption) p.caption=sub(c.caption);
          if(c.parse_mode) p.parse_mode=c.parse_mode;
          const kb=buildKb(c.buttons); if(kb) p.reply_markup={inline_keyboard:kb};
          const r=await this.tg('sendPhoto',p); this.addLog('🖼 Photo sent','out'); return {msgId:r.result?.message_id};
        }
        case 'send_vid': {
          const p={chat_id:chatId,video:c.url}; if(c.caption) p.caption=sub(c.caption);
          const kb=buildKb(c.buttons); if(kb) p.reply_markup={inline_keyboard:kb};
          const r=await this.tg('sendVideo',p); this.addLog('🎬 Video sent','out'); return {msgId:r.result?.message_id};
        }
        case 'send_audio': {
          const p={chat_id:chatId,audio:c.url}; if(c.caption) p.caption=sub(c.caption);
          const kb=buildKb(c.buttons); if(kb) p.reply_markup={inline_keyboard:kb};
          const r=await this.tg('sendAudio',p); this.addLog('🎵 Audio sent','out'); return {msgId:r.result?.message_id};
        }
        case 'send_doc': {
          const p={chat_id:chatId,document:c.url}; if(c.caption) p.caption=sub(c.caption);
          const kb=buildKb(c.buttons); if(kb) p.reply_markup={inline_keyboard:kb};
          const r=await this.tg('sendDocument',p); this.addLog('📄 File sent','out'); return {msgId:r.result?.message_id};
        }
        case 'edit_msg':
          if(lastId) await this.tg('editMessageText',{chat_id:chatId,message_id:lastId,text:sub(c.text||''),parse_mode:c.parse_mode||undefined});
          break;
        case 'del_msg': {
          const target=c.target||'last';
          const delId=target==='user'?msg.message_id:target==='id'?parseInt(c.msg_id):lastId;
          if(delId) await this.tg('deleteMessage',{chat_id:chatId,message_id:delId});
          this.addLog('🗑 Message deleted','out'); break;
        }
        case 'forward':
          await this.tg('forwardMessage',{chat_id:c.to||chatId,from_chat_id:chatId,message_id:lastId});
          break;
        case 'pin_msg': {
          const target=c.target||'last';
          const pinId=target==='user'?msg.message_id:target==='id'?parseInt(c.msg_id):lastId;
          if(pinId) await this.tg('pinChatMessage',{chat_id:chatId,message_id:pinId,disable_notification:!!c.silent});
          this.addLog('📌 Message pinned','out'); break;
        }
        case 'inline_kb': {
          const kb=buildKb(c.buttons||[]);
          const r=await this.tg('sendMessage',{chat_id:chatId,text:sub(c.text||'\u200b'),reply_markup:{inline_keyboard:kb||[]}});
          this.addLog('⌨ Inline keyboard отправлена','out'); return {msgId:r.result?.message_id};
        }
        case 'reply_kb': {
          const kb=(c.buttons||[]).map(row=>(row||[]).map(btn=>({text:btn.text||''}))).filter(r=>r.length);
          const r=await this.tg('sendMessage',{chat_id:chatId,text:sub(c.text||'\u200b'),reply_markup:{keyboard:kb,resize_keyboard:!!c.resize,one_time_keyboard:!!c.one_time}});

        }
        case 'remove_kb': {
          const r=await this.tg('sendMessage',{chat_id:chatId,text:'\u200b',reply_markup:{remove_keyboard:true}});

        }
        case 'if_else': {
          const vn=(c.var||'').replace(/[{}]/g,'');
          const vv=String((this.vars.get(chatId)||{})[vn]??ctx[vn]??'');
          const cv=sub(c.val||'');
          const pass=c.op==='='?vv===cv:c.op==='!='?vv!==cv:c.op==='contains'?vv.includes(cv):c.op==='startsWith'?vv.startsWith(cv):c.op==='endsWith'?vv.endsWith(cv):c.op==='>'?+vv>+cv:c.op==='<'?+vv<+cv:false;
          if(!pass) return {stop:true};
          this.addLog('⚡ Condition: прошло','sys');
          break;
        }
        case 'wait_input': {
          this.addLog('⏳ Waiting for input...','sys');
          await new Promise(resolve=>{
            const ms=parseInt(c.timeout||0)*1000;
            const timer=ms>0?setTimeout(async()=>{ this.waiting.delete(chatId); if(c.timeout_msg) await this.tg('sendMessage',{chat_id:chatId,text:sub(c.timeout_msg)}); resolve(); },ms):null;
            this.waiting.set(chatId,{resolve,timer,varName:c.save_to||'input'});

        }
        case 'delay':
          this.addLog('⏱ Delay '+(c.ms||1000)+'ms','sys');

        case 'set_var':
          this.setVar(chatId, c.var_name||c.name, sub(c.val||''), c.var_type||'local');
          this.addLog(`📦 ${c.var_name||c.name} = ${sub(c.val||'')} (${c.var_type||'local'})`,'sys'); break;
        case 'var_math': {
          const vtype=c.var_type||'local', vname=c.var_name||'', val=sub(c.value||'1');
          const cur=this.getVar(chatId,vname,vtype);
          let res;
          switch(c.operation||'+'){
            case'+': res=(parseFloat(cur)||0)+(parseFloat(val)||0); break;
            case'-': res=(parseFloat(cur)||0)-(parseFloat(val)||0); break;
            case'*': res=(parseFloat(cur)||0)*(parseFloat(val)||1); break;
            case'/': res=parseFloat(val)?((parseFloat(cur)||0)/parseFloat(val)):cur; break;
            case'%': res=parseFloat(val)?((parseFloat(cur)||0)%parseFloat(val)):cur; break;
            case'set': res=val; break;
            case'concat':  res=String(cur)+val; break;
            case'prepend': res=val+String(cur); break;
            default: res=val;
          }
          const fin=['concat','prepend'].includes(c.operation)?String(res):String(Math.round(parseFloat(res)*100000)/100000);
          this.setVar(chatId,vname,fin,vtype);
          this.addLog(`🔢 ${vname} ${c.operation||'+'} ${val} = ${fin}`,'sys'); break;
        }
        case 'if_else': {
          const vtype=c.var_type||'local', vname=(c.var||'').replace(/[{}]/g,'');
          const vv=String(this.getVar(chatId,vname,vtype)||ctx[vname]||'');
          const cv=sub(c.val||'');
          const pass=c.op==='='?vv===cv:c.op==='!='?vv!==cv:c.op==='contains'?vv.includes(cv):c.op==='startsWith'?vv.startsWith(cv):c.op==='endsWith'?vv.endsWith(cv):c.op==='>'?+vv>+cv:c.op==='<'?+vv<+cv:false;
          if(!pass) return {stop:true};
          this.addLog('⚡ Condition executedо','sys'); break;
        }
        case 'jump': return {jump:c.flow};
        // ── Groups ──
        case 'group_only':
          if(!['group','supergroup'].includes(msg.chat?.type)){this.addLog('👥 Not a group — stop','sys');return{stop:true};} break;
        case 'private_only':
          if(msg.chat?.type!=='private'){this.addLog('💬 Not private — stop','sys');return{stop:true};} break;
        case 'if_admin': {
          if(!['group','supergroup'].includes(msg.chat?.type)){
            this.addLog('🛡 if_admin: не группа, пропускаем','sys'); break;
          }
          try{
            const r=await this.tg('getChatMember',{chat_id:chatId,user_id:msg.from?.id});
            if(!['creator','administrator'].includes(r.result?.status)){this.addLog('🛡 Not admin — stop','sys');return{stop:true};}
            this.addLog('🛡 Admin — continue','sys');
          }catch(e){this.addLog('⚠ getChatMember: '+e.message,'err');return{stop:true};} break;
        }
        case 'if_not_admin': {
          if(!['group','supergroup'].includes(msg.chat?.type)) break; // в личке всегда не-admin
          try{
            const r=await this.tg('getChatMember',{chat_id:chatId,user_id:msg.from?.id});
            if(['creator','administrator'].includes(r.result?.status)){this.addLog('🛡 Is admin — stop','sys');return{stop:true};}
          }catch(_){} break;
        }
        case 'get_member': {
          if(!['group','supergroup'].includes(msg.chat?.type)){
            if(c.save_to) this.setVar(chatId,c.save_to,'member','local');
            this.addLog('🔎 Privat chat — member','sys'); break;
          }
          const uid=c.user_id?parseInt(c.user_id):msg.from?.id;
          try{
            const r=await this.tg('getChatMember',{chat_id:chatId,user_id:uid});
            const st=r.result?.status||'unknown';
            if(c.save_to) this.setVar(chatId,c.save_to,st,'local');
            this.addLog('🔎 Status: '+st,'sys');
          }catch(e){this.addLog('⚠ getChatMember: '+e.message,'err');} break;
        }
        case 'del_user_msg':
          if(msg.message_id) await this.tg('deleteMessage',{chat_id:chatId,message_id:msg.message_id}).catch(()=>{});
          this.addLog('🗑 User message deleted','out'); break;
        case 'gemini_clear': {
          const session = c.session_id || '';
          const prefix = String(msg.from?.id||chatId)+':'+String(chatId)+':';
          if (!session) {
            for (const k of this.geminiCtx.keys()) { if(k.startsWith(prefix)) this.geminiCtx.delete(k); }
          } else { this.geminiCtx.delete(prefix+(session||'default')); }
          this.addLog('🗑 Gemini history cleared','sys'); break;
        }
        case 'chatgpt': {
          if (!c.api_key) { this.addLog('⚠ ChatGPT: API ключ не задан','err'); break; }
          const model   = c.model || 'gpt-4o-mini';
          const sysText = sub(c.prompt || 'You are a helpful assistant. Reply briefly.');
          const userMsg = msg.text || '';
          const ctxMode = c.context_mode || 'last';
          const maxHist = parseInt(c.max_history || 10);
          const session = c.session_id || 'default';
          const ctxKey  = String(msg.from?.id||chatId)+':'+String(chatId)+':'+session;
          const messages = [{ role:'system', content: sysText }];
          if (ctxMode === 'history') {
            messages.push(...(this.gptCtx.get(ctxKey)||[]));
            if (c.use_user_text!==false && userMsg) messages.push({role:'user',content:userMsg});
          } else if (ctxMode === 'custom') {
            const ctxVal = sub('{{' + (c.ctx_var||'ctx') + '}}');
            messages.push({role:'user', content: ctxVal + (c.use_user_text!==false&&userMsg?'\n\nПользователь: '+userMsg:'')});
          } else {
            messages.push({role:'user', content: c.use_user_text!==false ? userMsg : sub(c.prompt||'Привет')});
          }
          try {
            this.tg('sendChatAction',{chat_id:chatId,action:'typing'}).catch(()=>{});
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.api_key},

            const data = await res.json();

            const reply = data.choices?.[0]?.message?.content || '(нет ответа)';
            if (ctxMode==='history') {
              const hist = this.gptCtx.get(ctxKey)||[];
              if(c.use_user_text!==false&&userMsg) hist.push({role:'user',content:userMsg});
              hist.push({role:'assistant',content:reply});
              while(hist.length>maxHist*2) hist.splice(0,2);
              this.gptCtx.set(ctxKey,hist);

            }
            if (c.save_to) this.setVar(chatId,c.save_to,reply,c.var_type||'local');

            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method:'POST',
              headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+c.api_key,
                'HTTP-Referer':'https://telebot-creator.app',
                'X-Title':'Telebot Creator'
              },
              body: JSON.stringify({ model, messages, max_tokens:parseInt(c.max_tokens||500) })
            });
            const data = await res.json();
            if (!res.ok) {
              const em = data.error?.message || 'error '+res.status;
              this.addLog(`⚠ ${model}: `+em,'err');
              if(c.send_response!==false) await this.tg('sendMessage',{chat_id:chatId,text:'⚠ AI error: '+em});
              break;
            }
            const reply = data.choices?.[0]?.message?.content || '(нет ответа)';
            if (ctxMode==='history') {
              const hist = this.gptCtx.get(ctxKey)||[];
              if(c.use_user_text!==false&&userMsg) hist.push({role:'user',content:userMsg});
              hist.push({role:'assistant',content:reply});
              while(hist.length>maxHist*2) hist.splice(0,2);
              this.gptCtx.set(ctxKey,hist);
            }
            if (c.save_to) this.setVar(chatId,c.save_to,reply,c.var_type||'local');
            if (c.send_response!==false) {
              const r = await this.tg('sendMessage',{chat_id:chatId,text:reply});
              return {msgId:r.result?.message_id};
            }
            this.addLog(`🐋 ${block.type==='deepseek'?'DeepSeek':'OpenRouter'}: `+reply.substring(0,60),'out');
          } catch(e) { this.addLog(`⚠ ${block.type}: `+e.message,'err'); }
          break;
        }
        case 'custom_script': {
          const code = (c.code||'').trim().replace(/^\/\/[^\n]*\n/gm,'').trim(); // strip comment-only lines for check
          const rawCode = (c.code||'').trim();
          if (!rawCode || !rawCode.replace(/\/\/[^\n]*/g,'').trim()) {
            this.addLog('📜 Custom Script: empty','sys'); break;
          }
          try {
            const tgCall = (method, params) => this.tg(method, params);
            const botProxy = {
              sendMessage:      (cid,text,opts={}) => tgCall('sendMessage',{chat_id:cid,text,...opts}),
              sendPhoto:        (cid,photo,opts={}) => tgCall('sendPhoto',{chat_id:cid,photo,...opts}),
              sendVideo:        (cid,video,opts={}) => tgCall('sendVideo',{chat_id:cid,video,...opts}),
              sendAudio:        (cid,audio,opts={}) => tgCall('sendAudio',{chat_id:cid,audio,...opts}),
              sendDocument:     (cid,document,opts={}) => tgCall('sendDocument',{chat_id:cid,document,...opts}),
              editMessageText:  (text,opts={}) => tgCall('editMessageText',{text,...opts}),
              deleteMessage:    (cid,mid) => tgCall('deleteMessage',{chat_id:cid,message_id:mid}),
              pinChatMessage:   (cid,mid,opts={}) => tgCall('pinChatMessage',{chat_id:cid,message_id:mid,...opts}),
              forwardMessage:   (to,from,mid) => tgCall('forwardMessage',{chat_id:to,from_chat_id:from,message_id:mid}),
              getChatMember:    (cid,uid) => tgCall('getChatMember',{chat_id:cid,user_id:uid}),
              getChatAdministrators:(cid) => tgCall('getChatAdministrators',{chat_id:cid}),
              banChatMember:    (cid,uid,opts={}) => tgCall('banChatMember',{chat_id:cid,user_id:uid,...opts}),
              unbanChatMember:  (cid,uid) => tgCall('unbanChatMember',{chat_id:cid,user_id:uid}),
              restrictChatMember:(cid,uid,opts={}) => tgCall('restrictChatMember',{chat_id:cid,user_id:uid,...opts}),
              promoteChatMember:(cid,uid,opts={}) => tgCall('promoteChatMember',{chat_id:cid,user_id:uid,...opts}),
              answerCallbackQuery:(id,opts={}) => tgCall('answerCallbackQuery',{callback_query_id:id,...opts}),
              sendChatAction:   (cid,action) => tgCall('sendChatAction',{chat_id:cid,action}),
              createChatInviteLink:(cid,opts={}) => tgCall('createChatInviteLink',{chat_id:cid,...opts}),
            };
            const AsyncFunc = Object.getPrototypeOf(async function(){}).constructor;
            const fn = new AsyncFunc(
              'bot','chatId','msg','sub','setVar','getVar','sleep','fetch','log',
              rawCode
            );
            await fn(
              botProxy, chatId, msg,
              (s) => sub(s),
              (k,v,t='local') => this.setVar(chatId,k,v,t),
              (k,t='local') => this.getVar(chatId,k,t),
              (ms) => new Promise(r=>setTimeout(r,parseInt(ms)||0)),
              fetch,
              (txt,type='sys') => this.addLog('📜 '+txt, type)
            );
            this.addLog('📜 Custom Script: executed','sys');
          } catch(e) {
            this.addLog('⚠ Custom Script error: '+e.message,'err');
          }
          break;
        }
        case 'random': {
          let result;
          if (c.mode === 'choice') {
            const items = (c.items||'').split(',').map(s=>s.trim()).filter(Boolean);
            result = items.length ? items[Math.floor(Math.random()*items.length)] : '';
          } else {
            const mn=parseInt(c.min||'1'), mx=parseInt(c.max||'100');
            result = String(Math.floor(Math.random()*(mx-mn+1))+mn);
          }
          this.setVar(chatId, c.save_to||'random', result, c.var_type||'local');
          this.addLog('🎲 Random: '+result,'sys');
          break;
        }
        case 'gemini': {
          if (!c.api_key) { this.addLog('⚠ Gemini: API ключ не задан','err'); break; }
          const model   = c.model || 'gemini-2.0-flash';
          const sysText = sub(c.prompt || 'You are a helpful assistant. Reply briefly.');
          const userMsg = msg.text || '';
          const ctxMode = c.context_mode || 'last';
          const maxHist = parseInt(c.max_history || 10);
          const session = c.session_id || 'default';
          const ctxKey  = String(msg.from?.id||chatId)+':'+String(chatId)+':'+session;

          // Build contents array
          let contents = [];

          if (ctxMode === 'history') {
            // Get stored history
            const hist = this.geminiCtx.get(ctxKey) || [];
            contents = [...hist];
            // Add current user message
            if (c.use_user_text !== false && userMsg) {
              contents.push({ role:'user', parts:[{text: userMsg}] });
            }
          } else if (ctxMode === 'custom') {
            // Use variable as context
            const ctxVal = sub('{{' + (c.ctx_var||'ctx') + '}}');
            const userPart = c.use_user_text !== false && userMsg ? '\n\nПользователь: '+userMsg : '';
            contents = [{ role:'user', parts:[{text: ctxVal + userPart}] }];
          } else {
            // 'last' — just the current message
            const userPart = c.use_user_text !== false ? userMsg : sub(c.prompt||'');
            contents = [{ role:'user', parts:[{text: userPart}] }];
          }

          if (!contents.length) {
            contents = [{ role:'user', parts:[{text: userMsg || 'Привет'}] }];
          }

          try {
            // Send "печатает..." action
            this.tg('sendChatAction',{chat_id:chatId,action:'typing'}).catch(()=>{});

            const body = {
              contents,
              systemInstruction: { parts:[{text: sysText}] },
              generationConfig: {
                maxOutputTokens: parseInt(c.max_tokens||500),
                temperature: parseFloat(c.temperature||1.0),
              }
            };

            const res = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+c.api_key,
              { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }
            );
            const data = await res.json();

            if (!res.ok) {
              const errMsg = data.error?.message || 'API error '+res.status;
              this.addLog('⚠ Gemini error: '+errMsg,'err');
              if (c.send_response!==false) await this.tg('sendMessage',{chat_id:chatId,text:'⚠ Gemini: '+errMsg});
              break;
            }

            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(нет ответа)';

            // Update history if context mode = history
            if (ctxMode === 'history') {
              const hist = this.geminiCtx.get(ctxKey) || [];
              if (c.use_user_text !== false && userMsg) hist.push({role:'user',parts:[{text:userMsg}]});
              hist.push({role:'model',parts:[{text:reply}]});
              // Trim to maxHist (each turn = 2 entries)
              while (hist.length > maxHist * 2) hist.splice(0, 2);
              this.geminiCtx.set(ctxKey, hist);
              this.addLog('🧠 History: '+hist.length/2+' turns','sys');
            }

            // Save to variable
            if (c.save_to) this.setVar(chatId, c.save_to, reply, c.var_type||'local');

            // Send response
            if (c.send_response !== false) {
              const r = await this.tg('sendMessage',{chat_id:chatId,text:reply});
              return {msgId:r.result?.message_id};
            }

            this.addLog('✨ Gemini: '+reply.substring(0,60)+(reply.length>60?'...':''),'out');
          } catch(e) {
            this.addLog('⚠ Gemini exception: '+e.message,'err');
          }
          break;
        }
        case 'send_admin_msg': {
          const text=sub(c.text||'Message for administrators');
          const opts={}; if(c.parse_mode) opts.parse_mode=c.parse_mode;
          try {
            const res=await this.tg('getChatAdministrators',{chat_id:chatId});
            if(!res.ok) { this.addLog('⚠ Could not get admin list','err'); break; }
            const target=c.target||'admins';
            const admins=res.result.filter(a=>target==='owner'?a.status==='creator':['creator','administrator'].includes(a.status));
            let sent=0;
            for(const a of admins){
              if(a.user?.is_bot) continue;
              const r=await this.tg('sendMessage',{chat_id:a.user.id,text:`📢 [Только для администраторов]\n\n${text}`,...opts});
              if(r.ok) sent++;
            }
            this.addLog(`📢 Sent: ${sent} admins via DM`,'out');
          } catch(e) { this.addLog('⚠ Error: '+e.message,'err'); }
          break;
        }
        case 'ban': {
          const isGrp=['group','supergroup'].includes(msg.chat?.type);
          if(!isGrp){this.addLog('⚠ ban: только в группах','err');break;}
          const uid=msg.from?.id; if(!uid) break;
          const rb=await this.tg('banChatMember',{chat_id:chatId,user_id:uid,until_date:this.parseDur(c.time)});
          this.addLog(rb.ok?'🚫 Banned':'⚠ Ban failed: '+(rb.description||''),'out'); break;
        }
        case 'kick': {
          if(!['group','supergroup'].includes(msg.chat?.type)){this.addLog('⚠ kick: только в группах','err');break;}
          const uid=msg.from?.id; if(!uid) break;
          await this.tg('banChatMember',{chat_id:chatId,user_id:uid});
          await new Promise(r=>setTimeout(r,400));
          await this.tg('unbanChatMember',{chat_id:chatId,user_id:uid});
          this.addLog('👢 Kicked','out'); break;
        }
        case 'mute': {
          if(!['group','supergroup'].includes(msg.chat?.type)){this.addLog('⚠ mute: только в группах','err');break;}
          const uid=msg.from?.id; if(!uid) break;
          const rm=await this.tg('restrictChatMember',{chat_id:chatId,user_id:uid,permissions:{can_send_messages:false,can_send_media_messages:false,can_send_polls:false,can_send_other_messages:false},until_date:this.parseDur(c.time)});
          this.addLog(rm.ok?'🔇 Muted':'⚠ Mute failed: '+(rm.description||''),'out'); break;
        }
        case 'unmute': {
          if(!['group','supergroup'].includes(msg.chat?.type)){this.addLog('⚠ unmute: только в группах','err');break;}
          const uid=msg.from?.id; if(!uid) break;
          await this.tg('restrictChatMember',{chat_id:chatId,user_id:uid,permissions:{can_send_messages:true,can_send_media_messages:true,can_send_polls:true,can_send_other_messages:true,can_add_web_page_previews:true,can_change_info:false,can_invite_users:true,can_pin_messages:false}});
          this.addLog('🔊 Unmuted','out'); break;
        }
        case 'promote': {
          if(!['group','supergroup'].includes(msg.chat?.type)){this.addLog('⚠ promote: только в группах','err');break;}
          const uid=msg.from?.id; if(!uid) break;
          const rp=await this.tg('promoteChatMember',{chat_id:chatId,user_id:uid,can_change_info:!!c.can_change_info,can_delete_messages:!!c.can_delete,can_restrict_members:!!c.can_ban,can_invite_users:!!c.can_invite,can_pin_messages:!!c.can_pin});
          this.addLog(rp.ok?'👑 Promoted to admin':'⚠ Promote failed: '+(rp.description||''),'out'); break;
        }
        case 'http': {
          try {
            const method=c.method||'GET';
            const opts={method,headers:c.headers?JSON.parse(sub(c.headers)):{}};
            if(!['GET','HEAD'].includes(method)&&c.body) opts.body=sub(c.body);
            const r=await fetch(sub(c.url),opts); const txt=await r.text();
            if(c.save_to) this.setVar(chatId,c.save_to,txt);
            this.addLog('🔗 HTTP '+method+' → '+r.status,'sys');
          } catch(e) { if(c.save_to) this.setVar(chatId,c.save_to,'ERROR:'+e.message); }
          break;
        }
        case 'webhook':
          fetch(sub(c.url),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.ctx(chatId,msg))}).catch(()=>{});
          this.addLog('🌐 Webhook sent','sys'); break;
        case 'invite': {
          const opts={chat_id:c.chat_id||chatId};
          if(parseInt(c.expire)) opts.expire_date=parseInt(c.expire);
          if(parseInt(c.uses))   opts.member_limit=parseInt(c.uses);
          const r=await this.tg('createChatInviteLink',opts);
          if(r.result?.invite_link) { await this.tg('sendMessage',{chat_id:chatId,text:r.result.invite_link}); this.addLog('🔑 Link sent','out'); }
          break;
        }
      }
    } catch(e) { this.addLog('⚠ Блок "'+block.type+'": '+e.message,'err'); }
    return {};
  }

  ctx(chatId, msg) {
    return { chat_id:String(chatId), user_id:String(msg.from?.id||''), username:msg.from?.username||'', first_name:msg.from?.first_name||'', last_name:msg.from?.last_name||'', text:msg.text||'', message_id:String(msg.message_id||''), callback_data:msg.callback_data||'', date:new Date().toLocaleDateString('ru') };
  }

  parseDur(s) { if(!s||s==='0') return 0; const n=parseInt(s)||0,now=Math.floor(Date.now()/1000); return s.includes('d')?now+n*86400:s.includes('h')?now+n*3600:s.includes('m')?now+n*60:0; }

  // Check AND conditions attached to a trigger
  async checkConds(chatId, conditions, msg) {
    if (!conditions?.length) return true;
    for (const cond of conditions) {
      let pass = true;
      switch(cond.type) {
        case 'var': {
          const vv = String(this.getVar(chatId, cond.var_name||'', cond.var_type||'local'));
          const cv = cond.val||'';
          pass = cond.op==='='?vv===cv:cond.op==='!='?vv!==cv:cond.op==='contains'?vv.includes(cv):cond.op==='startsWith'?vv.startsWith(cv):cond.op==='>'?+vv>+cv:cond.op==='<'?+vv<+cv:true;
          break;
        }
        case 'chat_group':
          pass = ['group','supergroup'].includes(msg?.chat?.type); break;
        case 'chat_priv':
          pass = msg?.chat?.type === 'private'; break;
        case 'is_admin': {
          try { const r=await this.tg('getChatMember',{chat_id:chatId,user_id:msg?.from?.id}); pass=['creator','administrator'].includes(r.result?.status); } catch(_){pass=false;}
          break;
        }
        case 'not_admin': {
          try { const r=await this.tg('getChatMember',{chat_id:chatId,user_id:msg?.from?.id}); pass=!['creator','administrator'].includes(r.result?.status); } catch(_){pass=true;}
          break;
        }
        case 'time': {
          const h=new Date().getHours();
          pass=h>=parseInt(cond.hour_from||0)&&h<=parseInt(cond.hour_to||23); break;
        }
        case 'username': {
          const uname=(msg?.from?.username||'').toLowerCase();
          const target=(cond.username||'').toLowerCase().replace(/^@/,'');
          const mode=cond.mode||'equals';
          pass = mode==='list'
            ? target.split(',').map(s=>s.trim()).includes(uname)
            : mode==='contains' ? uname.includes(target) : uname===target;
          break;
        }
        default: pass=true;
      }
      if (!pass) return false;
    }
    return true;
  }
}

let engine = null;

async function toggleBot() {
  const btn = document.getElementById('btn-run');
  const status = document.getElementById('bot-status');
  const logPanel = document.getElementById('log-panel');
  const cfg = getServerCfg(S.cBot?.id);
  const useServer = !!(cfg.url && cfg.key);

  // ── SERVER MODE ─────────────────────────────────────────────────────────
  if (useServer) {
    const botId = S.cBot?.id;
    if (!botId) { alert('No bot selected!'); return; }

    // Check if running on server
    const isRunning = btn.dataset.serverRunning === '1';
    if (isRunning) {
      // STOP on server
      btn.textContent='⏳ Stopping...'; btn.disabled=true;
      try {
        await serverRequest('/api/stop', {botId});
      } catch(_) {}
      btn.dataset.serverRunning='0';
      btn.textContent='▶ Run Bot';
      btn.style.cssText='background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.35);min-width:110px';
      btn.disabled=false;
      status.style.display='none';
      clearInterval(window._serverLogInterval);
      return;
    }

    // START on server
    if (!S.cBot?.token) { alert('No bot selected!'); return; }
    btn.textContent='⏳ Starting on server...'; btn.disabled=true;
    await saveFlow();

    const flows = S.flows
      .filter(f=>f.name!=='__variables__')
      .map(f=>f.id===S.cFlow?.id?{...f,blocks:S.blocks}:f);

    try {
      const r = await serverRequest('/api/start', {
        botId, token: S.cBot.token, flows, vars: S.botVars
      });
      if (!r.ok) throw new Error(r.error||'Server error');

      btn.dataset.serverRunning='1';
      btn.textContent='⏹ Stop (Server)';
      btn.style.cssText='background:rgba(129,140,248,.15);color:#818CF8;border:1px solid rgba(129,140,248,.35);min-width:110px';
      btn.disabled=false;
      status.style.display='flex';
      status.innerHTML=`<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;background:rgba(129,140,248,.15);border:1px solid rgba(129,140,248,.3);font-size:11px;color:#818CF8">☁️ Running on server</span>`;
      logPanel.style.display='flex';
      document.getElementById('log-msgs').innerHTML='';

      // Poll server logs every 2s
      clearInterval(window._serverLogInterval);
      window._srvLogSince = 0;
      window._serverLogInterval = setInterval(()=>pollServerLogs(botId), 2000);
    } catch(e) {
      btn.textContent='▶ Run Bot'; btn.disabled=false;
      alert('Server error: '+e.message);
    }
    return;
  }

  // ── BROWSER MODE ─────────────────────────────────────────────────────────
  // If server is configured → NEVER use browser, always redirect to server
  if (!useServer) {
    const anyCfg = getServerCfg(S.cBot?.id);
    if (anyCfg.url && anyCfg.key) {
      // Has server config but somehow bypassed — force server mode
      window.location.reload(); return;
    }
  }

  if (engine && engine.running) {
    engine.stop(); engine = null;
    btn.textContent = '▶ Run Bot';
    btn.style.cssText = 'background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.35);min-width:110px';
    status.style.display = 'none';
    logPanel.style.display = 'none';
    return;
  }

  if (!S.cBot?.token) { alert('No bot selected!'); return; }

  // Safety check: is bot already running on ANY server?
  const anyServerCfg = getServerCfg(S.cBot?.id);
  if (anyServerCfg.url && anyServerCfg.key) {
    try {
      const sr = await fetch(anyServerCfg.url+'/api/status/'+S.cBot.id, {headers:{'x-server-key':anyServerCfg.key}, signal:AbortSignal.timeout(3000)});
      const sd = await sr.json();
      if (sd.running) {
        btn.textContent='▶ Run Bot'; btn.disabled=false;
        await checkServerStatus(S.cBot.id);
        return;
      }
    } catch(_) {}
  }
  btn.textContent = '⏳ Starting...'; btn.disabled = true;
  logPanel.style.display = 'flex';
  document.getElementById('log-msgs').innerHTML = '';

  engine = new BotEngine(
    S.cBot.token,
    () => S.flows.filter(f=>f.name!=='__variables__').map(f => f.id===S.cFlow?.id ? {...f,blocks:S.blocks} : f),
    S.botVars
  );

  try {
    await engine.start();
    btn.textContent = '⏹ Stop Bot';
    btn.style.cssText = 'background:rgba(248,113,113,.15);color:#F87171;border:1px solid rgba(248,113,113,.35);min-width:110px';
    btn.disabled = false;
    status.style.display = 'flex';
    S.selId = null; renderCanvas(); renderCfg();
  } catch(e) {
    engine = null;
    btn.textContent = '▶ Run Bot'; btn.disabled = false;
    btn.style.cssText = 'background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.35);min-width:110px';
    logPanel.style.display = 'none';
    alert('❌ Start error: ' + e.message);
  }
}
